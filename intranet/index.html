<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GROW · Acceso equipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{--paper:#FFFFFF;--ink:#0E1F14;--green:#1D5C34;--green-d:#144426;--muted:#56655B;--rule:#D5DDD7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);font:400 16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
    .gate{width:min(400px,calc(100vw - 32px));border-top:2px solid var(--ink);padding-top:24px}
    .mono{font:500 12px/1.5 "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--green);margin:0 0 16px}
    h1{font-weight:500;font-size:32px;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}
    p{color:var(--muted);margin:0 0 32px;font-size:14px}
    label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
    input{width:100%;padding:12px 16px;border:1px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);font:inherit}
    input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}
    button{margin-top:16px;width:100%;padding:12px 24px;border:1px solid var(--green);border-radius:0;background:var(--green);color:var(--paper);font:500 14px/1.5 "IBM Plex Sans",system-ui,sans-serif;cursor:pointer}
    button:hover{background:var(--green-d);border-color:var(--green-d)}
    button:disabled{opacity:.6;cursor:progress}
    #msg{min-height:1.5em;margin:16px 0 0;color:var(--ink);font-size:14px}
    .back{display:inline-block;margin-top:32px;padding-top:16px;border-top:1px solid var(--rule);width:100%;color:var(--green);font-size:14px;text-underline-offset:3px}
  </style>
</head>
<body>
  <main class="gate">
    <p class="mono">GROW · Acceso equipo</p>
    <h1>Contenido interno</h1>
    <p>Ingresa la clave para continuar.</p>
    <form id="f" autocomplete="off">
      <label for="pw">Clave</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <button id="go" type="submit">Entrar</button>
      <p id="msg" role="alert"></p>
    </form>
    <a class="back" href="../">Volver al sitio</a>
  </main>

  <script src="vault.js"></script>
  <script>
  (function () {
    'use strict';
    var V = window.GROW_VAULT;
    var f = document.getElementById('f'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go');
    var enc = new TextEncoder(), dec = new TextDecoder();

    function fromB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
    function toB64(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
    function safe(js) { return String(js).replace(/<\/(script)/gi, '<\\/$1'); }

    async function deriveKey(pass, salt, iter) {
      var km = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    function launch(parts, key, salt, iter) {
      // Permite re-cifrar el contenido con la misma clave al exportar.
      window.__growSeal = async function (newData) {
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var payload = JSON.stringify({ body: parts.body, css: parts.css, js: parts.js, data: newData });
        var ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(payload)));
        return { v: 1, kdf: 'PBKDF2-SHA256', iter: iter, salt: toB64(salt), iv: toB64(iv), ct: toB64(ct) };
      };
      var page = '<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<meta name="robots" content="noindex,nofollow"><title>GROW · Intranet</title><style>' + parts.css + '</style></head><body>' + parts.body +
        '<script>window.GROW_DATA = ' + safe(JSON.stringify(parts.data)) + ';<\/script><script>' + safe(parts.js) + '<\/script></body></html>';
      document.open(); document.write(page); document.close();
    }

    f.addEventListener('submit', async function (ev) {
      ev.preventDefault();
      if (!V || !window.crypto || !crypto.subtle) { msg.textContent = 'Este navegador no soporta el acceso seguro (requiere HTTPS).'; return; }
      go.disabled = true; msg.textContent = 'Verificando…';
      try {
        var salt = fromB64(V.salt), iter = V.iter;
        var key = await deriveKey(pw.value, salt, iter);
        var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(V.iv) }, key, fromB64(V.ct));
        var parts = JSON.parse(dec.decode(plain));
        launch(parts, key, salt, iter);
      } catch (e) {
        await new Promise(function (r) { setTimeout(r, 900); });
        msg.textContent = 'Clave incorrecta.';
        pw.select(); go.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
